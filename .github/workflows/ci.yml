name: CI

on:
  push:
    branches: [sloth/1.0]
  pull_request:
    branches: [sloth/1.0]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload api jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: packetevents-api
          path: api/build/libs/packetevents-api-*.jar
          if-no-files-found: error

      - name: Upload spigot jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: packetevents-spigot
          path: spigot/build/libs/packetevents-spigot-*.jar
          if-no-files-found: error

      - name: Upload netty-common jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: packetevents-netty-common
          path: netty-common/build/libs/packetevents-netty-common-*.jar
          if-no-files-found: error
