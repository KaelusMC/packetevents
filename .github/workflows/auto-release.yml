name: Auto Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [sloth/1.0]

jobs:
  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build -x test --no-daemon

      - name: Generate tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          TAG="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body: |
            Automatic release from commit ${{ github.event.workflow_run.head_sha }}.

            JitPack:
            - `com.github.KaelusMC.packetevents:api:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:spigot:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:netty-common:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:bungeecord:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:velocity:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:fabric:${{ steps.tag.outputs.tag }}`
            - `com.github.KaelusMC.packetevents:sponge:${{ steps.tag.outputs.tag }}`
          files: |
            build/libs/packetevents-*.jar
            !build/libs/packetevents-*-sources.jar
            !build/libs/packetevents-*-javadoc.jar
